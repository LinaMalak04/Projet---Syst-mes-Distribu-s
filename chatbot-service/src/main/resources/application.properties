spring.application.name=chatbot-service
server.port=8087
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# LLM : Groq exposes an OpenAI compatible API, so the Spring AI OpenAI starter is used
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.2
# Only the chat model is used
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# MCP client : the tools of ebank-service and customer-service (Streamable HTTP, endpoint /mcp)
spring.ai.mcp.client.name=chatbot-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.ebank-service.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081

# Telegram bot (long polling) : the bot starts only if a token is given (created with @BotFather)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
